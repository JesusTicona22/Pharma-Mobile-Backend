version: '3.8'
services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: pharmasoft-oracle
    environment:
      - ORACLE_PASSWORD=admin
      - APP_USER=PHARMADB
      - APP_USER_PASSWORD=1234567
    ports:
      - "1522:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
volumes:
  oracle-data: